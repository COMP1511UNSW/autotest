name: auto-blacken
on: [push, pull_request]
jobs:
  # job skipper in the case of concurrent push + pull_request trigger
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{steps.skip_check.outputs.should_skip}}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.1
        with:
          concurrent_skipping: 'same_content'
          do_not_skip: '["push"]'

  # actual autoblacken
  main_job:
    name: runner / black
    needs: pre_job
    if: ${{needs.pre_job.outputs.should_skip != 'true'}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.ref}}
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      # The same black as "make lint" checks with: the one in Pipfile.lock.
      # A separately installed black can disagree with it, and then this
      # job's commit is exactly what the lint job rejects.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install pipenv
        run: |
          python -m pip install --upgrade pipenv wheel

      - id: cache-pipenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{runner.os}}-py3.11-pipenv-${{hashFiles('**/Pipfile.lock')}}

      - name: Install dependencies
        if: steps.cache-pipenv.outputs.cache-hit != 'true'
        run: |
          # --python: use the interpreter set up above rather than the one
          # the Pipfile [requires], which is not installed on the runner
          pipenv --python "$(which python)" install --dev

      - name: Check files using the black formatter
        id: action_black
        run: |
          pipenv run black .
          if git diff --quiet; then
            echo "is_formatted=false" >>"$GITHUB_OUTPUT"
          else
            echo "is_formatted=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Create commit on changes
        if: steps.action_black.outputs.is_formatted == 'true'
        run: |
          git config --global user.name '${{github.actor}}'
          git config --global user.email '${{github.actor}}@users.noreply.github.com'
          git commit -am ":art: Format Python code with psf/black" -m "There appear to be some python formatting errors in ${{github.sha}}."
          git push
