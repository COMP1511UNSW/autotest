name: checks
on: [push, pull_request]
jobs:
  # job skipper in the case of concurrent push + pull_request trigger
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{steps.skip_check.outputs.should_skip}}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.1
        with:
          concurrent_skipping: 'same_content'
          do_not_skip: '["push"]'

  # ruff, black, mypy, bandit and vulture, as configured in pyproject.toml
  lint:
    name: lint
    needs: pre_job
    if: ${{needs.pre_job.outputs.should_skip != 'true'}}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.ref}}
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Install pipenv
        run: |
          python -m pip install --upgrade pipenv wheel

      - id: cache-pipenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{runner.os}}-py3.11-pipenv-${{hashFiles('**/Pipfile.lock')}}

      - name: Install dependencies
        if: steps.cache-pipenv.outputs.cache-hit != 'true'
        run: |
          # --python: use the interpreter set up above rather than the one
          # the Pipfile [requires], which is not installed on the runner
          pipenv --python "$(which python)" install --dev

      - name: Run the static checkers
        run: |
          pipenv run make lint
