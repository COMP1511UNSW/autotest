name: auto-pytest
on: [push, pull_request]
permissions:
  actions: write
  contents: read
jobs:
  # job skipper in the case of concurrent push + pull_request trigger
  pre_job:
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{steps.skip_check.outputs.should_skip}}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5.3.1
        with:
          concurrent_skipping: 'same_content'
          do_not_skip: '["push"]'

  # actual auto pytest
  main_job:
    name: pytest (py${{ matrix.python-version }})
    needs: pre_job
    if: ${{needs.pre_job.outputs.should_skip != 'true'}}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{github.event.pull_request.head.ref}}
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{matrix.python-version}}
          architecture: x64

      - name: Install pipenv
        run: |
          python -m pip install --upgrade pipenv wheel

      - id: cache-pipenv
        uses: actions/cache@v4
        with:
          path: ~/.local/share/virtualenvs
          key: ${{runner.os}}-py${{matrix.python-version}}-pipenv-${{hashFiles('**/Pipfile.lock')}}

      - name: Install dependencies
        if: steps.cache-pipenv.outputs.cache-hit != 'true'
        run: |
          # --python: use the interpreter set up above rather than the one
          # the Pipfile [requires], which is not installed on the runner
          pipenv --python "$(which python)" install --dev

      # No "|| true": the coverage gate assumes a host which can build the
      # sandbox, so a runner where this stops working must fail here, with
      # a message naming user namespaces, rather than later as an
      # unexplained drop in coverage.
      - name: Allow unprivileged user namespaces (needed by the sandbox on Ubuntu 24.04+)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check that this runner can build a sandbox
        run: |
          pipenv run python -c 'import sandbox, sys; r = sandbox.probe(sandbox.config_from_parameters({})); sys.exit(0 if r is None else f"no sandbox on this runner: {r}")'

      - name: Run test suite
        env:
          # tests/environment expects it when autotest is run on that fixture
          SAMPLE_ENVIRONMENT_VARIABLE: sample_value
          # the checkout above uses fetch-depth: 0, so the comparison
          # against main must run rather than skip
          AUTOTEST_REQUIRE_MAIN_COMPARISON: "1"
        run: |
          if [ "${{matrix.python-version}}" = "3.11" ]; then
            pipenv run make coverage
          else
            pipenv run make test
          fi
